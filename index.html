<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暗影纪元：放置编年史</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <h1>暗影纪元</h1>
        <span class="subtitle">放置编年史 · 45° 等距挂机</span>
      </div>
      <div class="header-stats">
        <div id="hero-name" class="hero-name">狂战士 Lv.1</div>
        <div class="exp-container">
          <div class="exp-bar-bg"><div id="exp-bar" class="exp-bar"></div></div>
          <span id="exp-text" class="exp-text">经验 0 / 500</span>
        </div>
        <div class="gold">金 <span id="gold-amount">0</span></div>
        <div class="gold dim">包 <span id="inv-count">0/64</span></div>
      </div>
    </header>

    <main class="main-grid">
      <section class="panel hero-panel">
        <h2>营地</h2>
        <div id="hero-status" class="status fighting">自动战斗</div>
        <div class="hp-container">
          <div class="hp-bar-bg"><div id="hero-hp-bar" class="hp-bar hero-hp"></div></div>
          <span id="hero-hp-text">120 / 120</span>
        </div>
        <div id="equip-slots" class="equip-grid"></div>
        <div class="action-buttons">
          <button id="btn-skills" class="btn">技能</button>
          <button id="btn-inventory" class="btn">背包</button>
          <button id="btn-equipment" class="btn">装备</button>
          <button id="btn-characters" class="btn">角色</button>
          <button id="btn-autosell" class="btn">自动出售</button>
          <button id="btn-offline" class="btn btn-offline">离线收益</button>
        </div>
      </section>

      <section class="panel combat-panel">
        <div class="map-info">
          <h2 id="current-map-name">荒芜平原</h2>
          <span id="map-level-range" class="map-level">怪物 Lv.1–6</span>
        </div>
        <canvas id="iso-canvas" class="iso-canvas" width="640" height="360"></canvas>
        <div class="monster-display compact">
          <div class="monster-title-row">
            <div id="monster-name" class="monster-name">搜寻目标…</div>
            <span id="monster-kind" class="monster-kind"></span>
          </div>
          <div class="hp-container">
            <div class="hp-bar-bg"><div id="monster-hp-bar" class="hp-bar monster-hp"></div></div>
            <span id="monster-hp-text">—</span>
          </div>
          <div id="boss-winrate" class="boss-winrate" style="display:none"></div>
        </div>
        <div id="kill-counter" class="kill-counter">击杀 0 / 80</div>
        <div id="combat-log" class="combat-log"></div>
      </section>

      <section class="panel stats-panel">
        <h2>效率</h2>
        <div class="stat-grid">
          <div class="stat-item"><span class="stat-label">DPS</span><span id="stat-dps" class="stat-value">0</span></div>
          <div class="stat-item"><span class="stat-label">EHP</span><span id="stat-ehp" class="stat-value">0</span></div>
          <div class="stat-item"><span class="stat-label">击杀/分</span><span id="stat-kpm" class="stat-value">0</span></div>
          <div class="stat-item"><span class="stat-label">经验/时</span><span id="stat-eph" class="stat-value">0</span></div>
          <div class="stat-item"><span class="stat-label">连击</span><span id="stat-combo" class="stat-value">0</span></div>
          <div class="stat-item"><span class="stat-label">技能点</span><span id="skill-points" class="stat-value">0</span></div>
        </div>
        <h2>地图</h2>
        <div id="map-list" class="map-list"></div>
      </section>
    </main>

    <footer class="footer">
      <span>暗影纪元 GDD v1.1</span>
      <span>等距像素挂机 · 七职业 · 暗金性态 · 自动出售</span>
    </footer>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-overlay"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
