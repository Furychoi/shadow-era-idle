name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Pack static site
        run: |
          mkdir -p _site "_site/games/塔防"
          cp index.html _site/
          cp -R css js _site/
          if [ -d docs ]; then cp -R docs _site/; fi
          cp "games/塔防/index.html" "_site/games/塔防/"
          cp -R "games/塔防/css" "games/塔防/js" "_site/games/塔防/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
